name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (например v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc"
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            pkg-config \
            clang \
            libclang-dev \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libv4l-dev \
            wget
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Prepare binary
        run: |
          strip target/release/blink_guard
          cp target/release/blink_guard blink_guard-linux-x86_64
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/blink_guard AppDir/usr/bin/blink_guard
          ln -s usr/bin/blink_guard AppDir/AppRun
          cat << 'EOF' > AppDir/blink_guard.desktop
          [Desktop Entry]
          Name=Blink Guard
          Exec=blink_guard
          Icon=blink_guard
          Type=Application
          Categories=Utility;
          EOF
          echo "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAGUlEQVRYR+3BMQEAAADCoPVPbQhfoAAAAAB4mgAJuAAB9wWpRAAAAABJRU5ErkJggg==" | base64 -d > AppDir/blink_guard.png
          cp AppDir/blink_guard.png AppDir/.DirIcon
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir blink_guard-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            blink_guard-linux-x86_64
            blink_guard-linux-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Prepare binary
        shell: bash
        run: cp target/release/blink_guard.exe blink_guard-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: blink_guard-windows-x86_64.exe

  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check files
        run: ls -lah dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/blink_guard-linux-x86_64
            dist/blink_guard-linux-x86_64.AppImage
            dist/blink_guard-windows-x86_64.exe
