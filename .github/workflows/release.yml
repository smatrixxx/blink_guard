name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            ca-certificates
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build release
        run: cargo build --release
      - name: Prepare binary
        run: |
          strip target/release/blink_guard
          cp target/release/blink_guard blink_guard-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: blink_guard-linux-x86_64
          path: blink_guard-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Prepare binary
        shell: bash
        run: cp target/release/blink_guard.exe blink_guard-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: blink_guard-windows-x86_64
          path: blink_guard-windows-x86_64.exe

  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blink_guard-linux-x86_64
          path: ./
      - uses: actions/download-artifact@v4
        with:
          name: blink_guard-windows-x86_64
          path: ./
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            blink_guard-linux-x86_64
            blink_guard-windows-x86_64.exe
